<div id="cpmp-row-{{ target.id }}" style="display:flex;align-items:center;gap:6px;">
    <label style="display:flex;align-items:center;gap:6px;background:#f5f7fa;border:1px solid #e0e0e0;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;">
        <input type="checkbox"
               name="0-cpmp_target"
               value="{{ target.id }}"
               class="checkbox checkbox-primary"
               {% if target.id|stringformat:"s" in selected_cpmp_target %}checked{% endif %}>
        <span class="text-sm">{{ target.text }}</span>
    </label>

    <button type="button" class="btn-xs btn-ghost btn rounded-md legitRipple" title="Edit"
            hx-get="{% url 'cpmp-edit-ge' target.id %}"
            hx-target="#cpmp-row-{{ target.id }}" hx-swap="outerHTML">
        ✏️
    </button>
    <button type="button" class="btn-xs btn-ghost btn rounded-md legitRipple text-error" title="Delete"
            hx-get="{% url 'cpmp-delete-ge' target.id %}"
            hx-target="#cpmp-row-{{ target.id }}" hx-swap="outerHTML">
        🗑
    </button>
</div>
